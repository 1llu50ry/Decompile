# LLVM/lld linker overrides.
# Activate with: cp core/.cargo/config.lld.toml core/.cargo/config.toml
# (CI release workflow copies it into place automatically before `cargo build`.)

[build]
rustflags = [
  "-Clinker-plugin-lto",
  "-Ccodegen-units=1",
]

[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"

[target.aarch64-pc-windows-msvc]
linker = "lld-link.exe"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=lld"]

[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-musl]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=lld"]

[target.x86_64-apple-darwin]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=lld"]

[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=lld"]
