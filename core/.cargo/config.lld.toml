# LLVM/lld linker overrides.
# Activated in CI by copying this file into `core/.cargo/config.toml`
# before `cargo build`.
#
# IMPORTANT: linker overrides are opt-in per target. Only x86_64-linux-gnu
# is overridden here because:
#   - cross-rs runs inside Docker containers that don't inherit the host's
#     clang+lld; forcing `linker = "clang"` breaks every cross build.
#   - Windows MSVC's default toolchain already includes `link.exe`; forcing
#     `lld-link.exe` requires an exact LLVM install path setup that choco
#     doesn't reliably provide.
#   - macOS runners already use clang+ld64 by default.
#
# The shared `[build]` rustflags apply to every target and give us
# consistent optimization regardless of linker.

[build]
rustflags = ["-Ccodegen-units=1"]

[profile.release]
# lto = "thin" and codegen-units=1 already set in core/Cargo.toml.
# Nothing to override here.

# Native Linux x64 gets the LLVM linker (proven working on ubuntu-latest).
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=lld"]
