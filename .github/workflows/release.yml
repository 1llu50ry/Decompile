name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'tag or ref to release from'
        required: true
        default: 'v5.0.0'

permissions:
  contents: write
  packages: write
  id-token: write  # for npm provenance

jobs:
  npm-publish:
    name: npm publish
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci || npm install
      - run: npx tsc
      - run: node --test tests/*.test.mjs
      # Ship the exact dependency tree CI tested: npm honours a published
      # npm-shrinkwrap.json for `npm i -g` and `npx` (package-lock is ignored).
      - name: pin dependency tree (npm-shrinkwrap.json)
        run: cp package-lock.json npm-shrinkwrap.json
      - name: verify package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e 'const f=require("./pack.json")[0].files.map(x=>x.path);for(const p of ["install.sh","install.ps1","npm-shrinkwrap.json","dist/index.js","db/skills.db","bin/runtime-admission.mjs"]){if(!f.includes(p)){console.error("missing from package: "+p);process.exit(1)}}console.log(f.length+" files ok")'
      - name: Publish to npm (skipped unless NPM_TOKEN is set)
        if: env.HAS_NPM_TOKEN == 'yes'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-publish:
    name: Docker publish (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/decompile:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/decompile:latest

  github-release:
    name: GitHub Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Generate release body
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE=${PREV:+$PREV..HEAD}
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## Changes" >> "$GITHUB_OUTPUT"
          git log --pretty=format:'- %s' $RANGE >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
